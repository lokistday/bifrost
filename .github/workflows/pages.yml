name: Verify and deploy Bifrost

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development tools
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
          python -m pip install -r labs/crypto/requirements.txt
      - name: Generate validated content and labs
        run: |
          python scripts/build_labs.py
          python scripts/build_pages.py
      - name: Verify teaching, navigation and labs
        run: |
          pnpm test
          python tests/labs_test.py
          python -m unittest discover -s tests -p '*_expansion_test.py' -v
          python tests/learning_revision_test.py
          sh tests/c_labs.sh
      - name: Require generated files to match committed sources
        run: |
          git diff --exit-code -- index.html sitemap.xml js/curriculum.js js/catalog.js js/courses js/visual-data.js tracks labs learn projects guides/bridges.html content/generated-paths.json content/site-metrics.json assets/og-image.svg README.md
          test -z "$(git ls-files --others --exclude-standard -- tracks labs js/courses learn projects)"
      - name: Package public files
        run: python scripts/package_site.py
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload tested artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
